# Dataset and task definitions.
# Column names follow the public releases as commonly distributed; run
#   python scripts/inspect_columns.py <dataset>
# after downloading to confirm them before the first experiment.
#
# Rules for every task:
#   - time_col: when the prediction is made; used for the temporal split and date features.
#   - leakage_cols: columns only known AFTER the prediction time. They are always dropped
#     (except in the leakage-injection ablation, which adds them back on purpose).
#   - drop_cols: personal data, free text, images, URLs. Always dropped.
#   - id_cols: high-cardinality identifiers. Dropped unless --keep-ids is set (ablation).
#   - group_col: rows with the same value belong together and share (almost) the same
#     label, e.g. the lines of one order. Used by --split grouped so that no group is on
#     both sides. It is not a feature unless it is also kept through --keep-ids.
#   - numeric_text_cols: numeric columns stored as text. Parsed to a number, plus a
#     "<col> (note)" categorical holding the kind of text found where there was no number.

datasets:
  dataco:
    description: DataCo Smart Supply Chain (order-line level)
    license: "CC BY 4.0 as listed on Mendeley Data, version 5 (DOI 10.17632/8gx2fvg2k6.5)"
    files: [DataCoSupplyChainDataset.csv]
    read_kwargs: {encoding: latin-1}
    time_col: "order date (DateOrders)"
    group_col: Order Id
    drop_cols:
      - Customer Email
      - Customer Password
      - Customer Fname
      - Customer Lname
      - Customer Street
      - Product Description
      - Product Image
    id_cols:
      - Customer Id
      - Order Customer Id
      - Order Id
      - Order Item Id
      - Order Item Cardprod Id
      - Product Card Id
      - Customer Zipcode
      - Order Zipcode
    other_date_cols: ["shipping date (DateOrders)"]
    tasks:
      late_delivery:
        type: classification
        target: {kind: column, col: Late_delivery_risk}
        leakage_cols: ["Days for shipping (real)", "Delivery Status", "Order Status", "shipping date (DateOrders)"]
      shipping_days:
        type: regression
        target: {kind: column, col: "Days for shipping (real)"}
        leakage_cols: [Late_delivery_risk, "Delivery Status", "Order Status", "shipping date (DateOrders)"]

  usaid:
    description: USAID Supply Chain Shipment Pricing (SCMS delivery history)
    # data.usaid.gov dataset a3rc-nmf6. Catalog metadata lists CC BY-ND 4.0 while its rights
    # note says CC-BY. Until confirmed, treat as no-derivatives: do not redistribute the
    # file or a modified copy.
    license: "UNCONFIRMED: CC BY-ND 4.0 per catalog metadata, CC-BY per its rights note"
    files: [SCMS_Delivery_History_Dataset.csv]
    numeric_text_cols: ["Weight (Kilograms)"]
    read_kwargs: {}
    time_col: "Scheduled Delivery Date"
    group_col: "ASN/DN #"  # one shipment; confirm it is the right unit after downloading
    drop_cols: []
    id_cols: [ID, Project Code, "PQ #", "PO / SO #", "ASN/DN #", Item Description, Molecule/Test Type, Brand, Dosage]
    other_date_cols: ["PQ First Sent to Client Date", "PO Sent to Vendor Date", "Delivered to Client Date", "Delivery Recorded Date"]
    tasks:
      late_delivery:
        type: classification
        target: {kind: late_flag, actual: "Delivered to Client Date", planned: "Scheduled Delivery Date"}
        leakage_cols: ["Delivered to Client Date", "Delivery Recorded Date", "Freight Cost (USD)", "Line Item Insurance (USD)"]
      freight_cost:
        type: regression
        target: {kind: numeric_column, col: "Freight Cost (USD)"}
        leakage_cols: ["Delivered to Client Date", "Delivery Recorded Date", "Line Item Insurance (USD)"]

  synth:
    description: Synthetic order lines with a known generating process (scripts/make_synthetic.py)
    license: "generated by this repository; MIT like the code"
    files: [synthetic_orders.csv]
    read_kwargs: {}
    time_col: order_date
    group_col: order_id
    drop_cols: [oracle_p_late]  # the true late probability; a ceiling, never a feature
    id_cols: [order_id, customer_id, supplier_id]
    other_date_cols: [ship_date, promised_date]  # promised = order date + scheduled_days
    tasks:
      late_delivery:
        type: classification
        target: {kind: column, col: late}
        leakage_cols: [ship_days, ship_date]
        label_time_cols: [ship_date, promised_date]
      shipping_days:
        type: regression
        target: {kind: column, col: ship_days}
        leakage_cols: [late, ship_date]
        label_time_cols: [ship_date]

  nyc311_hpd:
    description: NYC 311 housing service requests (agency HPD), one row per request (scripts/prepare_nyc311.py)
    license: "NYC Open Data terms of use; CHECK before publishing results"
    files: [nyc311_hpd.csv]
    read_kwargs: {dtype: {zip3: str}}
    time_col: created_date  # prediction is made when the request is filed
    drop_cols: []
    id_cols: [unique_key]
    other_date_cols: [closed_date, deadline]
    tasks:
      slow_14d:  # not closed within 14 days of filing
        type: classification
        target: {kind: column, col: slow}
        leakage_cols: [closed_date]
        # fast is known when the request is closed; slow is known once the 14 days have passed
        label_time_cols: [closed_date, deadline]

  criteo_attribution:
    description: Criteo attribution data, one row per clicked ad impression (scripts/prepare_criteo.py)
    license: "CC BY-NC-SA 4.0 (non-commercial), Criteo on Hugging Face: criteo/criteo-attribution-dataset"
    files: [criteo_attribution.csv]
    read_kwargs: {}
    time_col: click_date  # prediction is made at the click; dates are on an arbitrary origin
    group_col: uid
    drop_cols: []
    id_cols: [uid]
    other_date_cols: [conversion_date, deadline]
    tasks:
      converted_7d:  # a conversion within 7 days of the click
        type: classification
        target: {kind: column, col: converted}
        leakage_cols: [conversion_date]
        # a conversion is known when it happens; no conversion is known once the 7 days have passed
        label_time_cols: [conversion_date, deadline]

  olist:
    description: Olist Brazilian e-commerce, one row per delivered order (scripts/prepare_olist.py)
    license: "CC BY-NC-SA 4.0 on the original Kaggle release (non-commercial); confirm before publishing"
    files: [olist_orders.csv]
    read_kwargs: {dtype: {customer_zip_code_prefix: str, seller_zip_code_prefix: str}}
    time_col: order_purchase_timestamp  # prediction is made at purchase
    group_col: customer_unique_id       # repeat customers stay on one side
    drop_cols: []
    id_cols:
      - order_id
      - customer_unique_id
      - seller_id
      - customer_zip_code_prefix
      - seller_zip_code_prefix
      - customer_city
      - seller_city
    # The promised date itself is dropped; promised_days (promised - purchase) is the feature.
    other_date_cols: [order_approved_at, order_delivered_carrier_date, order_delivered_customer_date, order_estimated_delivery_date]
    tasks:
      late_delivery:
        type: classification
        target: {kind: column, col: late}
        leakage_cols: [delivery_days, order_approved_at, order_delivered_carrier_date, order_delivered_customer_date]
        # on time is known at delivery; late is known once the promised date has passed
        label_time_cols: [order_delivered_customer_date, order_estimated_delivery_date]
      delivery_days:
        type: regression
        target: {kind: column, col: delivery_days}
        leakage_cols: [late, order_approved_at, order_delivered_carrier_date, order_delivered_customer_date]
        label_time_cols: [order_delivered_customer_date]
